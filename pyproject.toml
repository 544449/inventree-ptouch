[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-ptouch"
version = "0.5.0"
description = "InvenTree label printer driver for Brother P-touch printers over Bluetooth"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["pillow"]

[project.entry-points."inventree_plugins"]
ptouch = "inventree_ptouch.plugin:PtouchPlugin"

[tool.setuptools]
packages = ["inventree_ptouch"]

[tool.setuptools.package-data]
inventree_ptouch = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
